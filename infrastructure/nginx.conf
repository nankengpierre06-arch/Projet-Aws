# Configuration Nginx pour le Journal Collaboratif
# Point d'entrée unique de la machine (Ports 80 et 443)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Racine des fichiers statiques compilés de la SPA React 18
    root /var/www/journal/frontend/dist;
    index index.html;

    # Compression Gzip des ressources web
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. Distribution de l'application Web monopage (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Mise en cache agressive des assets compilés avec empreinte (hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. Relais vers l'API REST & Gatekeeper (Port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Délais adaptés au pic de trafic
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 3. Relais vers le serveur de collaboration WSS Yjs (Port 1234)
    location /ws/ {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Connexions longues pour les 300 rédacteurs
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Contrôle de santé Nginx
    location /health-nginx {
        access_log off;
        return 200 "healthy\n";
    }
}

